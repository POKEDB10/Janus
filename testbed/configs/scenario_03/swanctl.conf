# Janus Testbed — Scenario 03
# Mode: Tunnel | Enc: AES-256-CBC | Auth: HMAC-SHA2-256-128 | DH: 14 (2048-MODP) | PFS: ON
# Compliance: MUST (AES-CBC legacy interop) + MUST (SHA2-256) + SHOULD+ (DH-14)
# This config is compliant but suboptimal (CBC mode, not AEAD)

connections {
    janus-s03 {
        version = 2
        local_addrs  = %any
        remote_addrs = %any

        local {
            auth = psk
            id = peer-left-03
        }
        remote {
            auth = psk
            id = peer-right-03
        }

        # IKE proposal: AES-256-CBC + SHA2-256 + PRF-SHA2-256 + MODP-2048 (group 14)
        proposals = aes256-sha256-prfsha256-modp2048!

        dpd_delay = 30s
        fragmentation = yes

        children {
            janus-s03-child {
                mode = tunnel

                # ESP: AES-256-CBC + HMAC-SHA2-256-128 (separate encrypt + auth, legacy)
                esp_proposals = aes256-sha256!

                copy_dscp = out
                copy_ecn = yes

                dpd_action = restart
                start_action = start
                close_action = restart

                life_time = 1h
                rekey_time = 48min

                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
            }
        }
    }
}

secrets {
    ike-s03 {
        id-left  = peer-left-03
        id-right = peer-right-03
        secret = "janus-testbed-psk-scenario-03"
    }
}
