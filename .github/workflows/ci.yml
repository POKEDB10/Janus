name: Janus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python Tests ────────────────────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tshark (for IKE parser tests)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          # Allow non-root tshark
          sudo chmod +x /usr/bin/tshark
          echo "tshark version: $(tshark --version | head -1)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          ruff check parsing/ ml/ compliance/ backend/ labeling/ reports/ dataset/ tests/
          ruff format --check parsing/ ml/ compliance/ backend/ labeling/ reports/

      - name: Run type check (mypy)
        run: |
          mypy parsing/ ml/ compliance/ --ignore-missing-imports
        continue-on-error: true  # Not blocking until types are complete

      - name: Run unit tests (fast path, no integration)
        run: |
          pytest tests/ -v -m "not integration and not slow" \
            --tb=short \
            --cov=parsing \
            --cov=ml \
            --cov=compliance \
            --cov=backend \
            --cov-report=xml \
            --cov-fail-under=50

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Frontend Build ──────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  # ── Docker Compose Validation ───────────────────────────────────────────────
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate root docker-compose.yml
        run: docker compose -f docker-compose.yml config

      - name: Validate testbed docker-compose.yml
        run: docker compose -f testbed/docker-compose.yml config
        continue-on-error: true  # Testbed may need special networking not available in CI

  # ── Security Scan ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run bandit (Python security linter)
        run: |
          pip install bandit[toml]
          bandit -r parsing/ ml/ compliance/ backend/ labeling/ \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          cat bandit-report.json | python -c "
          import json, sys
          r = json.load(sys.stdin)
          issues = r.get('results', [])
          high = [i for i in issues if i['issue_severity'] == 'HIGH']
          print(f'Bandit: {len(issues)} issues, {len(high)} HIGH severity')
          if len(high) > 0:
              for i in high:
                  print(f'  {i[\"filename\"]}:{i[\"line_number\"]} - {i[\"issue_text\"]}')
          "
        continue-on-error: true
