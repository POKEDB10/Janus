services:
  # ============================================================================
  # JANUS — Unified Production Container (FastAPI + React/Vite SPA + ML Ensemble)
  # ============================================================================
  janus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janus-app
    restart: unless-stopped
    # Expose to localhost only (local verification or LAN WireGuard admin)
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - PORT=7860
      - HOST=0.0.0.0
      - JANUS_REQUIRE_AUTH=${JANUS_REQUIRE_AUTH:-true}
      - JANUS_API_KEY=${JANUS_API_KEY}
      - JANUS_TOKEN_SECRET=${JANUS_TOKEN_SECRET}
      - JANUS_MAX_CONCURRENT_ANALYSES=${JANUS_MAX_CONCURRENT_ANALYSES:-2}
      - JANUS_UPLOAD_RATE_LIMIT=${JANUS_UPLOAD_RATE_LIMIT:-30}
      - JANUS_UPLOAD_RATE_WINDOW=${JANUS_UPLOAD_RATE_WINDOW:-300}
      - JANUS_LOG_LEVEL=${JANUS_LOG_LEVEL:-INFO}
      - JANUS_MAX_UPLOAD_MB=100
      - JANUS_DB_PATH=/app/data/janus_audit.db
    volumes:
      - janus_captures:/app/captures
      - janus_reports:/app/reports/output
      - janus_data:/app/data
    # Resource limits to protect 4GB host RAM and keep WireGuard alive
    mem_limit: 2800m
    mem_reservation: 1500m
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2800M
        reservations:
          memory: 1500M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - janus-net

  # ============================================================================
  # CLOUDFLARE TUNNEL — Secure outbound edge connector (no public IP / NAT)
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: janus-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      janus:
        condition: service_healthy
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks:
      - janus-net

networks:
  janus-net:
    driver: bridge

volumes:
  janus_captures:
    driver: local
  janus_reports:
    driver: local
  janus_data:
    driver: local
