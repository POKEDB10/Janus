# Janus Testbed — Scenario 11
# Mode: Tunnel | Enc: AES-256-GCM | Auth: AEAD | DH: 19 | PFS: ON | IPv6
# Same as S01 but using IPv6 addressing to test IPv6 VPN capture/parsing

connections {
    janus-s11 {
        version = 2
        # IPv6 addresses — configured per-container in docker-compose
        local_addrs  = %any6
        remote_addrs = %any6

        local {
            auth = psk
            id = peer-left-11
        }
        remote {
            auth = psk
            id = peer-right-11
        }

        proposals = aes256gcm16-prfsha384-ecp256!

        dpd_delay = 30s
        fragmentation = yes

        children {
            janus-s11-child {
                mode = tunnel

                esp_proposals = aes256gcm16!

                copy_dscp = out
                copy_ecn = yes

                dpd_action = restart
                start_action = start
                close_action = restart

                life_time = 1h
                rekey_time = 48min

                # IPv6 traffic selectors
                local_ts  = ::/0
                remote_ts = ::/0
            }
        }
    }
}

secrets {
    ike-s11 {
        id-left  = peer-left-11
        id-right = peer-right-11
        secret = "janus-testbed-psk-scenario-11"
    }
}
