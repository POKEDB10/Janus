  # ==========================================================================
  # INFRASTRUCTURE — Packet Capture (tshark / tcpdump)
  # ==========================================================================
  capture:
    image: nicolaka/netshoot:latest
    container_name: janus-capture
    hostname: capture
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Tshark captures all ESP, IKE, and plaintext on vpn-net.
    # The ring-buffer approach keeps captures to a manageable size.
    command: >
      sh -c "
        mkdir -p /captures;
        tshark
          -i eth0
          -b filesize:102400
          -b files:20
          -w /captures/janus_capture.pcapng
          -f 'udp port 500 or udp port 4500 or esp or ah'
          2>&1 | tee /captures/tshark.log
      "
    volumes:
      - captures:/captures
      - dataset:/dataset
    networks:
      vpn-net:
        ipv4_address: 172.20.100.2
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ==========================================================================
  # INFRASTRUCTURE — Traffic Generator (iperf3 + hping3 + tcpreplay)
  # ==========================================================================
  traffic-gen:
    image: nicolaka/netshoot:latest
    container_name: janus-traffic-gen
    hostname: traffic-gen
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # tc netem is applied by the entrypoint; traffic generation is triggered
    # externally via `make run-all-scenarios` or the generate_traffic.sh script.
    entrypoint: >
      sh -c "
        # Apply tc netem impairment to eth0 (inter-peer path).
        # Parameters match the defaults in scripts/setup_netem.sh.
        tc qdisc del dev eth0 root 2>/dev/null || true;
        tc qdisc add dev eth0 root netem
          delay 100ms 20ms distribution normal
          loss 1%
          corrupt 0.1%
          reorder 5% 25%;
        echo 'netem configured';
        tc qdisc show dev eth0;
        # Keep container alive so scripts can exec into it.
        tail -f /dev/null
      "
    volumes:
      - ./scripts:/scripts:ro
      - captures:/captures
      - dataset:/dataset
    networks:
      vpn-net:
        ipv4_address: 172.20.100.3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
