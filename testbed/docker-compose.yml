# =============================================================================
# Janus IPsec Testbed — Docker Compose v3.8
# =============================================================================
# Spins up 12 scenario pairs (initiator + responder), a packet-capture service,
# and a traffic-generation service.  Every peer runs strongSwan 5.9 built from
# testbed/Dockerfile.strongswan.
#
# Network layout
#   vpn-net  172.20.0.0/16  — control / management plane
#   vpn6-net fd00::/48      — IPv6 overlay (scenario 11 only)
#
# Container IP scheme
#   172.20.<scenario>.<1|2>   e.g. 172.20.1.1 (sc01-init), 172.20.1.2 (sc01-resp)
#   172.20.100.x              reserved for infra (capture, traffic-gen)
#
# tc netem (100 ms / ±20 ms / 1 % loss) is applied inside traffic-gen via
#   testbed/scripts/setup_netem.sh after the stack comes up.
# =============================================================================

version: "3.8"

# ---------------------------------------------------------------------------
# Re-usable fragments
# ---------------------------------------------------------------------------
x-strongswan-common: &strongswan-common
  build:
    context: .
    dockerfile: Dockerfile.strongswan
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - NET_RAW
  sysctls:
    net.ipv4.ip_forward: "1"
    net.ipv4.conf.all.rp_filter: "0"
    net.ipv4.conf.default.rp_filter: "0"
  volumes:
    - captures:/captures
    - dataset:/dataset
  networks:
    - vpn-net
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

  vpn6-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: fd00::/48

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  captures:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CAPTURES_DIR:-./captures}

  dataset:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATASET_DIR:-./dataset}

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ==========================================================================
  # SCENARIO 01 — Tunnel | AES-256-GCM | DH-19 (ecp256) | PFS-on
  # ==========================================================================
  sc01-init:
    <<: *strongswan-common
    container_name: sc01-init
    hostname: sc01-init
    environment:
      SCENARIO: "01"
      ROLE: initiator
      LOCAL_ID: "sc01-init@janus.lab"
      REMOTE_ID: "sc01-resp@janus.lab"
      LOCAL_ADDR: "172.20.1.1"
      REMOTE_ADDR: "172.20.1.2"
      PSK: "janus-sc01-supersecret"
    volumes:
      - ./configs/scenario_01:/etc/swanctl/conf.d:ro
      - captures:/captures
      - dataset:/dataset
    networks:
      vpn-net:
        ipv4_address: 172.20.1.1

  sc01-resp:
