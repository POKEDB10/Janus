# Janus Testbed — Scenario 05
# Mode: Tunnel | Enc: AES-256-GCM | Auth: AEAD | DH: 20 (384-bit ECP) | PFS: ON
# Compliance: MUST (AES-256-GCM) + RECOMMENDED (DH-20) — highest security config

connections {
    janus-s05 {
        version = 2
        local_addrs  = %any
        remote_addrs = %any

        local {
            auth = psk
            id = peer-left-05
        }
        remote {
            auth = psk
            id = peer-right-05
        }

        # IKE: AES-256-GCM-16 + PRF-SHA-384 + ECP-384 (group 20)
        proposals = aes256gcm16-prfsha384-ecp384!

        dpd_delay = 30s
        fragmentation = yes

        children {
            janus-s05-child {
                mode = tunnel

                # ESP: AES-256-GCM-16 (AEAD — best in class)
                esp_proposals = aes256gcm16!

                copy_dscp = out
                copy_ecn = yes

                dpd_action = restart
                start_action = start
                close_action = restart

                life_time = 1h
                rekey_time = 48min

                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
            }
        }
    }
}

secrets {
    ike-s05 {
        id-left  = peer-left-05
        id-right = peer-right-05
        secret = "janus-testbed-psk-scenario-05"
    }
}
