[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus"
version = "0.1.0"
description = "AI-Powered IPsec VPN Protocol Analyzer and Security Assessment Framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Cipher Ops Team", email = "cipherops@sih2026.dev" }
]
keywords = ["IPsec", "VPN", "security", "network-analysis", "IKE", "ESP", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

# Core runtime dependencies (shared across all modules)
dependencies = [
    "dpkt>=1.9.8",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
]
labeling = [
    "scapy>=2.5.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    # Backend deps needed for testing
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.9",
    "scapy>=2.5.0",
]
all = [
    "janus[backend]",
    "janus[labeling]",
    "janus[dev]",
]

[project.scripts]
janus-backend = "backend.main:app"
janus-build-dataset = "dataset.build_index:main"

[tool.hatch.build.targets.wheel]
packages = [
    "parsing",
    "ml",
    "compliance",
    "backend",
    "labeling",
    "capture",
    "reports",
    "dataset",
]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (use --fast to skip)",
    "integration: marks tests as integration tests requiring Docker",
    "unit: marks tests as pure unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:xgboost",
    "ignore::DeprecationWarning:shap",
]

# ── ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "T20"]
ignore = [
    "S101",  # assert usage OK in tests
    "S603",  # subprocess call with variable (needed for tshark)
    "S607",  # partial executable path (tshark path is configured)
    "T201",  # print() allowed in CLI scripts
]
extend-exclude = ["testbed/", "frontend/", ".venv/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "T20", "N802"]
"dataset/build_index.py" = ["T201"]
"testbed/*" = ["E501"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
exclude = ["testbed/", "frontend/", ".venv/", "build/"]
