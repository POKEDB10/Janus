# Janus Testbed — Scenario 02
# Mode: Tunnel | Enc: AES-128-GCM | Auth: AEAD (built-in) | DH: 19 (ECP-256) | PFS: ON
# This is a compliant modern config (slightly lower key length than S01)

connections {
    janus-s02 {
        version = 2
        local_addrs  = %any
        remote_addrs = %any

        local {
            auth = psk
            id = peer-left-02
        }
        remote {
            auth = psk
            id = peer-right-02
        }

        # IKE proposal: AES-128-GCM-16 + PRF-SHA-384 + ECP-256 (group 19)
        proposals = aes128gcm16-prfsha384-ecp256!

        dpd_delay = 30s
        fragmentation = yes

        children {
            janus-s02-child {
                mode = tunnel

                # ESP proposal: AES-128-GCM-16 (AEAD, no separate auth needed)
                esp_proposals = aes128gcm16!

                # copy_dscp for auto-labeling ground truth
                # WARNING: verify with labeling/verify_dscp_propagation.py first
                copy_dscp = out
                copy_ecn = yes

                # PFS enabled: rekey triggers new DH exchange using group 19
                dpd_action = restart
                start_action = start
                close_action = restart

                # SA lifetimes within compliant 1-8h window
                life_time = 1h
                rekey_time = 48min

                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
            }
        }
    }
}

secrets {
    ike-s02 {
        id-left  = peer-left-02
        id-right = peer-right-02
        # TODO(uncertain): Replace PSK with PKI/certificates before any production use.
        # PSK here is testbed-only for rapid scenario iteration.
        secret = "janus-testbed-psk-scenario-02"
    }
}
