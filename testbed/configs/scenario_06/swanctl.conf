# Janus Testbed — Scenario 06
# Mode: Tunnel | Enc: AES-256-GCM | Auth: AEAD | DH: 14 | PFS: OFF
# Compliance note: PFS DISABLED — flag HIGH risk per NIST SP 800-77 Rev.1
# This scenario tests the compliance engine's PFS detection

connections {
    janus-s06 {
        version = 2
        local_addrs  = %any
        remote_addrs = %any

        local {
            auth = psk
            id = peer-left-06
        }
        remote {
            auth = psk
            id = peer-right-06
        }

        proposals = aes256gcm16-prfsha256-modp2048!

        dpd_delay = 30s
        fragmentation = yes

        children {
            janus-s06-child {
                mode = tunnel

                esp_proposals = aes256gcm16!

                copy_dscp = out
                copy_ecn = yes

                dpd_action = restart
                start_action = start
                close_action = restart

                # PFS OFF: no DH group specified for child SA rekey
                # The absence of a DH group here means no PFS
                # (strongSwan will not do additional DH for child SA)
                # TODO(uncertain): verify that omitting dh_groups here actually disables PFS
                # in this version of strongSwan — behavior may differ from docs

                life_time = 1h
                rekey_time = 48min

                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
            }
        }
    }
}

secrets {
    ike-s06 {
        id-left  = peer-left-06
        id-right = peer-right-06
        secret = "janus-testbed-psk-scenario-06"
    }
}
