# =============================================================================
# Janus Testbed — Scenario 01 swanctl.conf
# =============================================================================
# Profile  : Tunnel | AES-256-GCM-16 | DH Group 19 (ECP-256) | PFS ON
# IKE ver  : IKEv2 only
# Auth     : PSK (TODO: migrate to X.509 certificate authentication)
#
# Compliance note
#   AES-256-GCM-16 is an AEAD cipher; no separate integrity algorithm is
#   needed or permitted in the ESP proposal (RFC 4106).
#   PRF SHA-384 is chosen to match the 256-bit security level of AES-256.
#   ECP-256 (NIST P-256) corresponds to IKEv2 DH group 19 (RFC 5903).
#
# Key lifetimes
#   IKE SA : 3600 s hard, rekey at 2880 s (80 %)
#   CHILD SA: 3600 s hard, rekey at 2880 s — rekey triggers new DH (PFS)
#
# DSCP / ECN behaviour
#   copy_dscp = out  — copy DSCP from inner to outer IP header on egress
#   copy_ecn  = yes  — RFC 6040 ECN tunnel encapsulation (outer ECN=inner ECN)
#   These fields are used by the Janus labelling pipeline to auto-tag flows.
# =============================================================================

connections {

    sc01 {
        # -----------------------------------------------------------------------
        # IKE proposal (phase 1)
        # Format: enc-prf-dh  (trailing '!' = strict, no fallback)
        # -----------------------------------------------------------------------
        proposals   = aes256gcm16-prfsha384-ecp256!

        version     = 2        # IKEv2 only
        mobike      = no       # disable MOBIKE (RFC 4555) — fixed testbed IPs

        # -----------------------------------------------------------------------
        # Peer addresses
        # These are overridden at runtime via environment variables in
        # entrypoint.sh; the values here are sane defaults.
        # -----------------------------------------------------------------------
        local_addrs  = 172.20.1.1
        remote_addrs = 172.20.1.2

        # -----------------------------------------------------------------------
        # Dead Peer Detection — send DPD probes every 30 s, timeout 120 s
        # -----------------------------------------------------------------------
        dpd_delay    = 30s
        dpd_timeout  = 120s

        # -----------------------------------------------------------------------
        # IKE SA lifetime + rekey
        # -----------------------------------------------------------------------
        rekey_time   = 2880s
        over_time    = 720s     # extra time before hard expiry
        rand_time    = 180s     # randomise rekey within ±rand_time

        # -----------------------------------------------------------------------
        # Fragmentation — required for large certificates / vendor IDs
        # -----------------------------------------------------------------------
        fragmentation = yes

        # -----------------------------------------------------------------------
        # Authentication — PSK
        # TODO(uncertain): switch to certificate-based auth (local_cert / remote_cert)
        #                  once the testbed PKI is provisioned.
        # -----------------------------------------------------------------------
        local {
            auth   = psk
            id     = sc01-init@janus.lab
        }

        remote {
            auth   = psk
            id     = sc01-resp@janus.lab
        }

        # -----------------------------------------------------------------------
        # CHILD SA (ESP / IPsec)
        # -----------------------------------------------------------------------
        children {
            sc01 {
                # ESP proposal — AES-256-GCM-16 AEAD, no separate integrity
                esp_proposals  = aes256gcm16!

                # Tunnel mode — encapsulates entire IP packet
                mode           = tunnel

                # DSCP / ECN copy behaviour (RFC 2983, RFC 6040)
                # copy_dscp = out  → outer header inherits inner DSCP on TX
                # copy_ecn  = yes  → ECN bits copied per RFC 6040 §4
                copy_dscp      = out
                copy_ecn       = yes

                # PFS: rekey the CHILD SA using a fresh DH exchange (group 19)
                # Setting rekey_time forces renegotiation; DH group is inherited
                # from the IKE proposal unless overridden below.
                rekey_time     = 2880s
                life_time      = 3600s
                rand_time      = 180s

                # Traffic selectors — match all traffic between the peers
                local_ts       = 0.0.0.0/0
                remote_ts      = 0.0.0.0/0

                # DPD action when peer goes silent
                dpd_action     = restart

                # Start CHILD SA automatically
                start_action   = start
                close_action   = restart
            }
        }
    }
}

# =============================================================================
# Secrets
# =============================================================================
# NOTE: The actual PSK value is injected at runtime by entrypoint.sh into
# /etc/swanctl/conf.d/00_psk_secret.conf to avoid baking credentials into
# image layers.  This block is intentionally empty — do not add secrets here.
# =============================================================================
secrets {
    # Populated by entrypoint.sh at container start
}
