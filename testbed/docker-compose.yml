    container_name: sc01-resp
    hostname: sc01-resp
    environment:
      SCENARIO: "01"
      ROLE: responder
      LOCAL_ID: "sc01-resp@janus.lab"
      REMOTE_ID: "sc01-init@janus.lab"
      LOCAL_ADDR: "172.20.1.2"
      REMOTE_ADDR: "172.20.1.1"
      PSK: "janus-sc01-supersecret"
