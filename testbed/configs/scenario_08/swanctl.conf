# Janus Testbed — Scenario 08
# Mode: TRANSPORT | Enc: AES-128-CBC | Auth: HMAC-SHA2-256-128 | DH: 14 | PFS: OFF
# Mixed scenario: transport mode + CBC + PFS disabled — compliance issues

connections {
    janus-s08 {
        version = 2
        local_addrs  = %any
        remote_addrs = %any

        local {
            auth = psk
            id = peer-left-08
        }
        remote {
            auth = psk
            id = peer-right-08
        }

        proposals = aes128-sha256-prfsha256-modp2048!

        dpd_delay = 30s
        fragmentation = yes

        children {
            janus-s08-child {
                mode = transport

                esp_proposals = aes128-sha256!

                copy_dscp = out
                copy_ecn = yes

                dpd_action = restart
                start_action = start
                close_action = restart

                # PFS OFF — triggers High risk finding
                life_time = 1h
                rekey_time = 48min

                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
            }
        }
    }
}

secrets {
    ike-s08 {
        id-left  = peer-left-08
        id-right = peer-right-08
        secret = "janus-testbed-psk-scenario-08"
    }
}
