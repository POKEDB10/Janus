# =============================================================================
# Janus Testbed — Scenario 09 swanctl.conf
# =============================================================================
# INTENTIONALLY WEAK CONFIG FOR COMPLIANCE ENGINE TESTING
#
# Profile  : Tunnel | 3DES-CBC | HMAC-SHA1-96 | DH Group 2 (MODP-1024) | PFS OFF
# IKE ver  : IKEv2 (using weak legacy algorithms to simulate non-compliant peers)
# Auth     : PSK
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# WARNING — THIS CONFIGURATION IS DELIBERATELY INSECURE
#
# 3DES-CBC       → vulnerable to Sweet32 birthday attack (RFC 8221 §3)
# HMAC-MD5       → MD5 is cryptographically broken (legacy compatibility only)
# HMAC-SHA1-96   → SHA-1 is deprecated for IKE (RFC 8221 §4)
# MODP-1024(DH2) → 1024-bit DH considered insufficient by NIST SP 800-131A
# PFS disabled   → session key compromise retroactively exposes all traffic
#
# DO NOT deploy in any production or security-sensitive environment.
# This scenario exists solely so the Janus compliance engine can produce
# FAIL results and test its detection / alert pipeline.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# Compliance findings expected
#   CRIT  — 3DES cipher (Sweet32 / RFC 8221 deprecated)
#   CRIT  — DH group 2 (MODP-1024, insufficient key size)
#   HIGH  — HMAC-SHA1-96 integrity (SHA-1 deprecated)
#   HIGH  — PFS disabled (CHILD SA rekey without new DH exchange)
#   MED   — IKE SA lifetime not limited (no rekey configured)
# =============================================================================

connections {

    sc09 {
        # -----------------------------------------------------------------------
        # IKE proposal (phase 1) — 3DES + MD5/SHA1 + MODP-1024
        # The '!' suffix enforces strict algorithm selection.
        # Note: strongSwan may warn about weak algorithms at startup; this is
        # expected and intentional.  Add 'charon.i_dont_care_...' only in lab.
        # -----------------------------------------------------------------------
        proposals   = 3des-sha1-modp1024!

        version     = 2        # IKEv2 negotiated, but with weak ciphersuite
        mobike      = no

        local_addrs  = 172.20.9.1
        remote_addrs = 172.20.9.2

        # DPD — still enabled so the testbed can detect dead peers, but with
        # a longer timer to reduce overhead on this weak-crypto scenario.
        dpd_delay    = 60s
        dpd_timeout  = 180s

        # IKE rekey disabled — intentional for compliance test (PFS-off means
        # we also skip IKE renegotiation to maximise weak-state duration).
        # TODO(uncertain): Determine if the compliance engine should flag
        #                  excessively long IKE lifetimes independently.
        rekey_time   = 0s       # 0 = no rekey (rely on hard lifetime only)
        over_time    = 0s
        rand_time    = 0s

        fragmentation = yes

        # -----------------------------------------------------------------------
        # Authentication — PSK
        # TODO(uncertain): Compliance engine should also test MD5-HMAC PSK
        #                  authentication modes (IKEv1 aggressive mode) if
        #                  capture data warrants it.
        # -----------------------------------------------------------------------
        local {
            auth   = psk
            id     = sc09-init@janus.lab
        }

        remote {
            auth   = psk
            id     = sc09-resp@janus.lab
        }

        # -----------------------------------------------------------------------
        # CHILD SA (ESP) — 3DES + SHA1 integrity, no AEAD
        # -----------------------------------------------------------------------
        children {
            sc09 {
                # ESP proposal — 3DES-CBC with HMAC-SHA1-96 integrity
                # INTENTIONALLY WEAK: see file header warnings
                esp_proposals  = 3des-sha1!

                mode           = tunnel

                # DSCP / ECN — preserved for Janus labelling even on weak scenarios
                copy_dscp      = out
                copy_ecn       = yes

                # PFS DISABLED — no DH group on CHILD SA rekey
                # In strongSwan, omitting a DH group from the ESP proposal AND
                # setting rekey_time to a high value with no PFS group achieves
                # PFS-off behaviour.
                # The CHILD SA will use the same keying material from the IKE SA.
                rekey_time     = 0s      # no rekey — keys persist for life_time
                life_time      = 28800s  # 8-hour lifetime (long, intentionally)
                rand_time      = 0s

                # Traffic selectors
                local_ts       = 0.0.0.0/0
                remote_ts      = 0.0.0.0/0

                dpd_action     = restart
                start_action   = start
                close_action   = restart
            }
        }
    }
}

# =============================================================================
# Secrets
# =============================================================================
# NOTE: PSK injected at runtime by entrypoint.sh (00_psk_secret.conf).
#       The weak PSK string "janus-sc09-weak" is also intentionally short
#       for compliance engine testing of PSK entropy checks.
# =============================================================================
secrets {
    # Populated by entrypoint.sh at container start
}
